name: Have GitHub autobuild the Docker image for verification

on:
  push:
    branches: [ "mainline" ]
  pull_request:
    branches: [ "mainline" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image purely off the Dockerfile
      run: docker build . --file Dockerfile --tag next-js-demo-github-auto:$(date +%s)
